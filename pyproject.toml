[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "pulid-app"
version = "0.1.1"
description = "Pipeline Python autonome pour PuLID et SDXL"
readme = "README.md"
requires-python = "==3.11.16"
dependencies = [
  "insightface==1.0.1",
  "numpy==2.4.6",
  "onnxruntime==1.28.0",
  "opencv-python==4.14.0.94",
  "Pillow==12.3.0",
  "PyYAML==6.0.3",
  "rich==14.3.4",
  # Utilisé par les transformations géométriques d'InsightFace.
  "scikit-image==0.25.2",
  "torch==2.13.0",
]

[project.optional-dependencies]
# Dépendances complémentaires installées lorsque les phases d'inférence commencent.
inference = [
  "accelerate==1.14.0",
  "diffusers==0.39.0",
  "huggingface-hub==1.27.0",
  "safetensors==0.8.0",
  "torchvision==0.28.0",
  "transformers==5.15.0",
]
pulid = [
  "einops==0.8.2",
  "facexlib==0.3.0",
  "ftfy==6.3.1",
  "timm==1.0.28",
]
server = [
  "fastapi==0.141.1",
  "python-multipart==0.0.32",
  "uvicorn==0.52.3",
]
embeddings = [
  "llama-cpp-python==0.3.35",
]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
]

[project.scripts]
pulid-gen = "pulid_app.cli:main"
pulid-inspect-models = "pulid_app.cli:inspect_main"
pulid-install = "pulid_app.installer:main"
pulid-server = "pulid_app.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pulid_app"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "unit: test rapide, isolé du réseau, du SSD externe et des modèles lourds",
  "integration: test plusieurs composants avec les modèles locaux configurés",
  "slow: test charge un checkpoint lourd ou exécute une génération",
  "gpu: test nécessitant un accélérateur MPS ou CUDA",
]

# Builders are also resolved in uv.lock. Install this group before building the
# few pure-Python sdists; no compiler or unpinned isolated build environment.
[dependency-groups]
build = ["hatchling==1.29.0", "editables==0.5", "setuptools==84.0.0", "wheel==0.46.3"]

[tool.uv]
required-version = "==0.12.10"
environments = [
  "sys_platform == 'win32'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
no-build-package = ["insightface", "llama-cpp-python", "torch", "torchvision"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchvision = [{ url = "https://download-r2.pytorch.org/whl/cu130/torchvision-0.28.0%2Bcu130-cp311-cp311-win_amd64.whl", marker = "sys_platform == 'win32'" }]
llama-cpp-python = [
  { url = "https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.35-cu130/llama_cpp_python-0.3.35-py3-none-win_amd64.whl", marker = "sys_platform == 'win32'" },
  { path = "runtime/wheels/llama_cpp_python-0.3.35-py3-none-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin'" },
]
