# L'installateur crée ce dossier à la racine du projet par défaut. Une
# installation locale peut le surcharger dans config/local.yaml.
models_root: PuLID_models

sdxl:
  # Le VAE est intégré à ce checkpoint Lightning/BakedVAE.
  checkpoint: checkpoints/realvisxlV50_v50LightningBakedvae.safetensors
  # Configs et tokenizers uniquement ; aucun poids SDXL n'est stocké ici.
  config_dir: sdxl/stable-diffusion-xl-base-1.0-config

pulid:
  checkpoint: pulid_v1.1.safetensors
  # Le code officiel est téléchargé ici à la révision épinglée, sans être
  # recopié dans le dépôt applicatif.
  source_dir: sources/PuLID
  revision: 1aa2fc7df4bf51080df39f355f9abdc1cbfefbaa
  eva_clip_model: EVA02-CLIP-L-14-336
  eva_clip_pretrained: eva_clip
  # FaceXLib reçoit explicitement cette racine pour ses poids automatiques.
  facexlib_root: facexlib/weights

insightface:
  model_root: .
  model_name: antelopev2

text_embedding:
  checkpoint: text_embedding/bge-m3-Q8_0.gguf
  model_id: text-embedding-bge-m3
  dimensions: 1024
  # La fenêtre reste identique en modes CPU, Metal et CUDA.
  context_size: 8192
  # Un encodeur bidirectionnel exige batch_size >= context_size dans llama.cpp.
  batch_size: 8192
  # En mode --CPU : 0 = tous les CPU logiques pour le traitement par lots.
  threads: 0

krea2:
  # Poids locaux fournis manuellement, indépendants de SDXL et PuLID.
  # BF16/FP16/FP32, NVFP4 Comfy ou FP8 E4M3 scaled déclarés dans le fichier.
  # Les poids quantifiés restent compactés ; le nom du fichier n'impose pas le dtype.
  checkpoint: krea2/checkpoints/krea2.safetensors
  text_encoder: text_encoders/qwen3vl/qwen3vl_4b_bf16.safetensors
  # Config et tokenizer Qwen3-VL-4B-Instruct, fournis manuellement aussi.
  text_encoder_config_dir: text_encoders/qwen3vl/config
  vae: vae/qwen_image_vae.safetensors

outputs_dir: ./outputs
identity_cache_dir: ./cache/identity

device:
  preferred: mps
  dtype: float16
  # Disponible pour CUDA : charge les composants SDXL en VRAM à la demande.
  # Désactivé par défaut pour préserver le comportement MPS actuel.
  offload_strategy: none
